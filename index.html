<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-start-->
    <title>Care@Home | AI that Cares for Aging at Home</title>
    <meta name="description" content="Developing a cutting-edge AI-based contactless monitoring ecosystem that supports independent living, reduces healthcare workload, and improves quality of life for older adults." />
    <!--app-head-end-->
    <meta name="theme-color" content="#0B285F" />
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%images/branding/favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%images/branding/apple-touch-icon.png" />
    <script>
      // Legacy URLs (index.html?page=contact, ?page=wps, …) from the previous website
      // are redirected to the new page addresses so old bookmarks and links keep working.
      (function () {
        try {
          var base = '%BASE_URL%';
          var params = new URLSearchParams(window.location.search);
          if (!params.has('page')) return;
          var path = window.location.pathname;
          if (path !== base && path !== base + 'index.html') return;
          var pages = {
            '': '', home: '', about: 'about/', objectives: 'objectives/', wps: 'work-packages/',
            consortium: 'consortium/', contact: 'contact/', events: 'events/'
          };
          var page = params.get('page');
          var target = Object.prototype.hasOwnProperty.call(pages, page) ? pages[page] : '404.html';
          window.location.replace(base + target + window.location.hash);
        } catch (e) {}
      })();
    </script>
    <noscript>
      <style>[data-reveal]{opacity:1!important;transform:none!important}</style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
